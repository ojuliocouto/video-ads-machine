# Roteiro anotado de exemplo. Uma entrada por cena, na ordem do video.
# Campos: fala (texto que o apresentador grava) | fase (hook|body|cta) |
#         tipo (avatar|broll|lettering|logo|avatar+lettering|avatar+broll|lettering+logo|lettering+logo_cta)
#         lettering_key (palavra em destaque, so quando tiver lettering)
#         broll (arquivo/link, so quando tiver insercao) | zoom (none|leve|forte) | pip (true/false)

criativo: EXEMPLO-01

roteiro:
  - { fala: "Voce prefere ter acesso a", fase: hook, tipo: avatar, zoom: leve }
  - { fala: "um banco de skills prontas, com varios funcionarios de IA?", fase: hook, tipo: broll, broll: banco.mp4, pip: true }
  - { fala: "ou prefere descobrir como CRIAR o seu proprio time de IA?", fase: hook, tipo: avatar, zoom: leve }
  - { fala: "Um time que trabalha por voce e te custa quase nada.", fase: body, tipo: lettering, lettering_key: POUCO }
  - { fala: "Toca no botao aqui embaixo e garante sua vaga, fechou?", fase: cta, tipo: lettering+logo_cta, lettering_key: VAGA }

# Hooks alternativos: cada um vira um video novo, reaproveitando o mesmo body + cta.
hooks_alternativos:
  - "Voce ainda paga caro por ferramenta que uma IA ja faz sozinha?"
  - "E se um time de IA trabalhasse por voce 24 horas por dia?"
