<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<style>
@font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:block;src:url("fonts/inter-400.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:600;font-style:normal;font-display:block;src:url("fonts/inter-600.woff2") format("woff2")}
@font-face{font-family:"Inter";font-weight:700;font-style:normal;font-display:block;src:url("fonts/inter-700.woff2") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:500;font-style:normal;font-display:block;src:url("fonts/montserrat-500.woff2") format("woff2")}
@font-face{font-family:"Montserrat";font-weight:600;font-style:normal;font-display:block;src:url("fonts/montserrat-600.woff2") format("woff2")}
@font-face{font-family:"Archivo";font-weight:800;font-style:normal;font-display:block;src:url("fonts/archivo-800.woff2") format("woff2")}
@font-face{font-family:"Playfair Display";font-weight:600;font-style:italic;font-display:block;src:url("fonts/playfair-italic-600.woff2") format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0c1116;font-family:"Montserrat","Inter",sans-serif;font-weight:600}
#root{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#0c1116}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:scale(1.000000)}
#zoom{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform-origin:50% 50%}
</style>
<style>
#root{background:#0c1116}
.app{width:min(1600px,94%);height:min(880px,88%);background:#12181f;border-radius:14px;border:1px solid #212b35;padding:36px 40px;box-shadow:0 40px 120px rgba(0,0,0,.65);display:flex;flex-direction:column}
h1{font-family:"Archivo","Inter",sans-serif;font-weight:800;color:#e9edef;font-size:28px;margin:0 0 26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols{position:relative;display:flex;gap:18px;flex:1;min-height:0}
.col{position:relative;flex:1;min-width:0;background:#161e27;border:1px solid #222d38;border-radius:12px;padding:16px}
.ct{color:#8696a0;font-size:15px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px;display:flex;justify-content:space-between;gap:8px}
.ct span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n{color:#e9edef}
.card{position:relative;background:#1c2632;border:1px solid #2a3642;border-radius:10px;padding:14px 16px;margin-bottom:12px}
.card.mov{z-index:5}
.cn{color:#e9edef;font-size:16px}
.cv{color:#31c48d;font-family:"Archivo","Inter",sans-serif;font-weight:800;font-size:15px;margin-top:6px}
.tag{display:inline-block;font-size:12px;color:#8696a0;background:#243040;border-radius:6px;padding:3px 8px;margin-top:8px}
.card.mov.vai{border-color:#4c8dff}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="4.0000" data-width="1920" data-height="1080">
<div id="stage"><div id="zoom">
<div class="app">
 <h1>Funil comercial movido pelo agente</h1>
 <div class="cols" id="cols" data-mov="1" data-de="2" data-para="3" data-final="ganhou agora" data-destaque="#4c8dff">
  <div class="col"><div class="ct"><span>Novos</span><span class="n">2</span></div>
   <div class="card"><div class="cn">Empresa A</div><div class="cv">R$ 4.500</div><div class="tag">chegou pelo site</div></div>
   <div class="card"><div class="cn">Empresa B</div><div class="cv">R$ 2.800</div><div class="tag">indicação</div></div>
   </div>
  <div class="col"><div class="ct"><span>Qualificados</span><span class="n">2</span></div>
   <div class="card"><div class="cn">Empresa C</div><div class="cv">R$ 6.200</div><div class="tag">agente qualificou</div></div>
   <div class="card"><div class="cn">Empresa D</div><div class="cv">R$ 3.900</div><div class="tag">respondeu a proposta</div></div>
   </div>
  <div class="col"><div class="ct"><span>Proposta</span><span class="n">1</span></div>
   <div class="card mov"><div class="cn">Empresa E</div><div class="cv">R$ 12.000</div><div class="tag">follow-up automático</div></div>
   </div>
  <div class="col"><div class="ct"><span>Fechado</span><span class="n">1</span></div>
   <div class="card"><div class="cn">Empresa F</div><div class="cv">R$ 5.400</div><div class="tag">ganhou ontem</div></div>
   </div>
  
 </div>
</div>
</div></div>
</div>
<script>
(function(){
  var cont=document.getElementById("cols"), cols=document.querySelectorAll(".col"), mov=document.querySelector(".card.mov");
  var ativo=cont.getAttribute("data-mov")==="1"&&mov;
  var de=parseInt(cont.getAttribute("data-de"),10), para=parseInt(cont.getAttribute("data-para"),10);
  var final=cont.getAttribute("data-final"), cor=cont.getAttribute("data-destaque");
  var tag=mov?mov.querySelector(".tag"):null, original=tag?tag.textContent:"";
  var qtd=[],i;
  for(i=0;i<cols.length;i++) qtd.push(parseInt(cols[i].querySelector(".n").textContent,10));
  window.vamQuadro=function(t,DUR){
    if(!ativo) return;
    var ini=DUR*0.3, dur=Math.min(1.2,DUR*0.4);
    var p=VAM.ease((t-ini)/dur), q=Math.min(1,Math.max(0,(t-ini)/dur));
    var dst=cols[para], src=cols[de], cartoes=dst.querySelectorAll(".card"), ult=cartoes[cartoes.length-1];
    var dx=dst.offsetLeft-src.offsetLeft, dy=(ult.offsetTop+ult.offsetHeight+12)-mov.offsetTop;
    mov.style.transform="translate("+(p*dx).toFixed(2)+"px,"+(p*dy).toFixed(2)+"px) rotate("+(p*(1-p)*4).toFixed(3)+"deg)";
    mov.style.boxShadow=(q>0&&q<1)?"0 18px 40px rgba(0,0,0,.5)":"none";
    mov.className=(q>0)?"card mov vai":"card mov";
    var feito=q>=1;
    cols[de].querySelector(".n").textContent=feito?qtd[de]-1:qtd[de];
    cols[para].querySelector(".n").textContent=feito?qtd[para]+1:qtd[para];
    if(tag&&final){tag.textContent=feito?final:original;tag.style.color=feito?cor:"";}
  };
})();
</script>
<script>
(function(){
  var raiz=document.getElementById("root");
  var DUR=parseFloat(raiz.getAttribute("data-duration"));
  function clamp(x){return x<0?0:(x>1?1:x)}
  window.VAM={
    clamp:clamp,
    ease:function(x){x=clamp(x);return 1-Math.pow(1-x,3)},
    passo:function(n,ini,fracao,maximo){return Math.min(maximo,(DUR*fracao-ini)/Math.max(1,n))},
    fmt:function(v,c){
      var s=Math.abs(v).toFixed(c).split("."),i=s[0],r="";
      while(i.length>3){r="."+i.slice(-3)+r;i=i.slice(0,-3)}
      r=i+r+(s.length>1?","+s[1]:"");
      return (v<0&&/[1-9]/.test(r))?"-"+r:r;
    }
  };
  function aplicar(t){
    if(!(t>0))t=0; if(t>DUR)t=DUR;
    var z=document.getElementById("zoom");
    if(z)z.style.transform="scale("+(1+0.03*(t/DUR)).toFixed(5)+")";
    if(window.vamQuadro)window.vamQuadro(t,DUR);
  }
  window.__vamSeek=aplicar;
  var tl={_t:0,
    seek:function(t){this._t=t;aplicar(t);return this},
    time:function(t){if(t===undefined)return this._t;return this.seek(t)},
    totalTime:function(t){if(t===undefined)return this._t;return this.seek(t)},
    duration:function(){return DUR},
    totalDuration:function(){return DUR},
    progress:function(){return this._t/DUR},
    pause:function(){return this},
    play:function(){return this},
    paused:function(){return true},
    isActive:function(){return false},
    getChildren:function(){return []},
    eventCallback:function(){return this}
  };
  window.__timelines=window.__timelines||{};
  window.__timelines["main"]=tl;
  var q=new URLSearchParams(location.search);
  aplicar(q.has("t")?parseFloat(q.get("t")):0);
})();
</script>
</body>
</html>
