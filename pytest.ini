[pytest]
# Esteira hermética (W0.1). Rodar pelo `bash scripts/dev/testar_limpo.sh`: ele monta o
# HOME temporário e o ambiente limpo. Direto com `python3 -m pytest` também funciona.
testpaths = scripts tests
python_files = test_*.py
# importlib: não mexe no sys.path por conta própria (dois test_x.py de pastas diferentes
# não colidem). O `pythonpath` abaixo devolve scripts/ e a raiz ao path, que é o que os
# testes antigos esperavam do modo prepend.
pythonpath = scripts .
addopts = --import-mode=importlib --strict-markers -rs -p no:cacheprovider
markers =
    lento: leva mais de alguns segundos (render, lote); fora da execução padrão, entra com --lento
    midia_real: precisa de mídia que não está no repo (paridade com o dono); só com VAM_PARIDADE_MIDIA
    rede: acessa a rede ou uma API paga; fora da execução padrão
