<html lang="pt" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">

    <style>
      /* Template 9x16 (1080x1920). Este arquivo guarda só a GEOMETRIA do formato: posição, tamanho, recuo
         e corpo de cada elemento. O visual compartilhado mora em templates/_parciais/ e entra pelos
         marcadores PARCIAL, resolvidos por overlay.html_injecao.resolver_parciais. Fix de visual se faz no
         parcial (vale para os dois formatos); fix de posição se faz aqui, medido neste quadro.
         Zona segura do Reels: nenhuma tinta abaixo de y 1690 nem à direita de x 940. */
      /* PARCIAL:base.css */
      /* PARCIAL:hook.css */
      /* PARCIAL:lettering_serif_editorial.css */
      /* PARCIAL:lettering_caixa_nativa.css */
      /* PARCIAL:lettering_punch.css */
      /* PARCIAL:lettering_marcador.css */
      /* PARCIAL:lettering_statement.css */
      /* PARCIAL:lettering_lateral.css */
      /* PARCIAL:lettering_seta_cta.css */
      /* PARCIAL:lettering_gigante_atras.css */
      /* PARCIAL:legenda.css */
      /* PARCIAL:cta.css */

      /* ================= GEOMETRIA 9x16 ================= */
      /* a linha abaixo é trocada INTEIRA pelo strip_overlay (fundo transparente do overlay): não reescrever */
      html, body { width:1080px; height:1920px; overflow:hidden; background:#05060a; }

      /* gancho: recuo de 160 px tira a tinta da coluna de curtir e comentar (x 940); com 100 px a linha do
         gancho chegava a x 1020 nos 2 s que decidem o scroll */
      #hook { padding:0 160px; }
      #hook .accent { font-size:104px; }

      .broll-vid { left:36px; width:1008px; top:452px; height:700px; }

      /* LETTERING. A faixa livre em tela cheia vai do fim do queixo (y ~1420 medido) ao teto da UI
         (y 1690): 260 px do rodapé põem a tinta em y ~1420-1660; recuo lateral de 170 px fecha antes de x 940.
         Tela dividida: o apresentador vive em y 1150-1920 e a única faixa limpa é ACIMA da costura, então o
         lettering sobe para 790 px do rodapé (tinta em y ~940-1130) com corpo menor. Close (baixo) e pilha
         descem para 250 px. A ORDEM das regras abaixo importa (mesma especificidade): pilha vence split e
         key-longa vence split e baixo. */
      .lett { padding:0 170px 260px; }
      .lett.lett-split { padding:0 170px 790px; }
      .lett.lett-split .key { font-size:62px; line-height:1.10; }
      .lett.lett-split .lead { font-size:24px; letter-spacing:5px; margin-bottom:10px; }
      .lett.lett-baixo { padding:0 170px 250px; }
      .lett.lett-baixo .key { font-size:62px; line-height:1.10; }
      .lett.lett-pilha { padding:0 170px 250px; }
      .lett.lett-split.lett-pilha { padding:0 170px 790px; }
      .lett.lett-pilha .key { font-size:54px; line-height:1.30; }
      .lett .lead { font-size:32px; margin-bottom:16px; }
      /* chave longa (18 caracteres ou mais) com corpo menor: a última palavra caía órfã */
      .lett .key.key-longa { font-size:82px; }
      .lett .key { font-size:104px; line-height:1.04; }

      /* LEGENDA (10/10/2026): uma posição só, a BASE do quadro. A caixa termina em y 1682 (bottom 238 px) e a linha de
         56 px x 1,14 tem o centro em y ~1650: o pedido era perto de y 1660, e os 8 px a mais de folga são do halo forte,
         cuja tinta (alfa >= 190) desce 17 px abaixo da letra e, medida no render, tocava y 1694 com a caixa em 1690
         (o teto da UI do Reels). Recuo lateral de 140 px fecha a tinta em x 140 a 940 (a coluna de curtir e comentar
         começa em 940). Sem padding vertical: o halo é sombra, não caixa, e não precisa de espaço. Grupo que quebra em duas linhas sobe (ancorado por baixo) e nunca desce. Durante o CTA
         (`cgrp-acima-cta`) ela sobe para bottom 820 px: a caixa termina em y 1100, 50 px acima do lead do CTA (y ~1150),
         e com o CTA em tela dividida (`caps-cta-split`, o CTA desce para a costura) sobe mais. */
      #caps .cgrp { bottom:238px; padding:0 140px; }
      #caps .cgrp.cgrp-acima-cta { bottom:820px; }
      #caps.caps-cta-split .cgrp.cgrp-acima-cta { bottom:1240px; }
      #caps .cw { font-size:56px; }

      /* LOGO e CTA, posicionados juntos: pílula em y ~1219-1350 e o logo abaixo. O logo leva o próprio
         fundo radial (o wordmark é claro). Em tela dividida os dois descem para a faixa da costura. */
      #ev-logo { bottom:333px; width:500px; padding:78px 120px; box-sizing:content-box;
        /* W7.Z: o logo da Escola tem um sol terracota (luminância 0,28): sobre o fundo de .02 a .03 media 4,2:1 a 4,5:1 durante
           o CTA inteiro (36,6 a 42,0 s da prova), abaixo do piso. Mais denso no miolo e no anel, o fundo local cai a ~.01. */
        background:radial-gradient(ellipse 62% 56% at 50% 50%, rgba(4,5,10,.97) 0%, rgba(4,5,10,.90) 46%, rgba(4,5,10,0) 90%); }
      #cta.cta-split { bottom:965px; }
      #cta.cta-split .pill { font-size:52px; }
      #ev-logo.logo-split { bottom:800px; width:330px; }
      #cta { bottom:570px; }
      #cta .lead { font-size:38px; }
      #cta .pill { font-size:66px; }
    </style>
  </head>
